
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 580 130"
     width="1160" height="260"
     role="img" aria-label="Glacious Fresh">

  <title>Glacious Fresh</title>

  <defs>
    <linearGradient id="speedLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="35%" stop-color="#8BC5E8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#174FAE" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- GLACIOUS wordmark -->
  <g fill="#8BC53F">
    <text x="290" y="66"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="66"
          font-weight="800"
          letter-spacing="-2.8">GLACIOUS</text>
  </g>

  <!-- Three blue speed lines -->
  <g fill="none"
     stroke="url(#speedLine)"
     stroke-width="2.8">
    <path d="M12 89 H386"/>
    <path d="M22 101 H405"/>
    <path d="M35 113 H383"/>
  </g>

  <!-- FRESH wordmark -->
  <text x="410" y="116"
        font-family="Arial, Helvetica, sans-serif"
        font-size="37"
        font-weight="700"
        font-style="italic"
        letter-spacing="9"
        fill="#8BC53F">FRESH</text>

</svg>
